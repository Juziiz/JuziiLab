# YouTube 增强
# 去除油管广告，支持后台播放、画中画

[rewrite_local]
^https:\/\/www\.youtube\.com\/(pagead|pcs)\/ url reject
^https:\/\/s\.youtube\.com\/api\/stats\/ads url reject
^https://((?:www|m)\.youtube\.com/api/timedtext\?)([^#]+)&tlang=([^&#]+)&([^#]*)(#.*)?$ url 302 https://$1$2&$4&subtype=Translate$5
^https://((?:www|m)\.youtube\.com/api/timedtext\?)([^#]+)&tlang=([^&#]+)(#.*)?$ url 302 https://$1$2&subtype=Translate$4
^https://((?:www|m)\.youtube\.com/api/timedtext\?)tlang=([^&#]+)&([^#]*)(#.*)?$ url 302 https://$1$3&subtype=Translate$4
^https://((?:www|m)\.youtube\.com/api/timedtext\?)tlang=([^&#]+)(#.*)?$ url 302 https://$1subtype=Translate$3
^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/player\/ad_break(?:\?.*)?$ url script-request-body https://raw.githubusercontent.com/Juziiz/JuziiLab/main/qx/YouTube_enhance_request.js
^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/offline\/get_download_action(?:\?.*)?$ url script-response-body https://raw.githubusercontent.com/Juziiz/JuziiLab/main/qx/YouTube_enhance_response.js#{"nativeDownload":true}
^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/player(?:\?.*)?$ url script-request-body https://raw.githubusercontent.com/Juziiz/JuziiLab/main/qx/YouTube_enhance_request.js#{"nativeDownload":true}
^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(?:navigation\/resolve_url|browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch|log_event|config)(?:\?.*)?$ url script-response-body https://raw.githubusercontent.com/Juziiz/JuziiLab/main/qx/YouTube_enhance_response.js#{"blockUpload":true,"blockShorts":true,"blockGames":true,"blockVerticalLive":true,"jumpAhead":true,"autoHd":true,"blockStore":true}
^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback(?:\?.*)?$ url script-response-body https://raw.githubusercontent.com/Juziiz/JuziiLab/main/qx/YouTube_enhance_response.js#{"blockGames":true,"blockVerticalLive":true,"jumpAhead":true,"autoHd":true,"blockStore":true}
^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback(?:\?.*)?$ url script-request-body https://raw.githubusercontent.com/Juziiz/JuziiLab/main/qx/YouTube_enhance_request.js
^https?:\/\/[\w-]+\.googlevideo\.com\/videoplayback url script-request-body https://raw.githubusercontent.com/Juziiz/JuziiLab/main/qx/YouTube_enhance_request.js#{"autoHd":true}
^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/log_event url script-request-header https://raw.githubusercontent.com/Juziiz/JuziiLab/main/qx/YouTube_enhance_request.js
^https://(?:www|m)\.youtube\.com/api/timedtext(?:\?|$) url script-response-body https://raw.githubusercontent.com/IBL3ND/js/refs/heads/main/YT-CC-ASR-Auto.js

[mitm]
hostname = *.googlevideo.com, youtubei.googleapis.com, www.youtube.com, m.youtube.com, s.youtube.com
