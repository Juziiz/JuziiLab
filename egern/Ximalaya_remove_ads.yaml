name: 喜马拉雅去广告
icon: https://resource.wuyra.com/Icon/App_icon/120px/Himalaya.png
description: 解锁喜马拉雅会员，移除开屏广告、播放器广告，精简频道和我的页面。
author: WeiGiegie
homepage: https://kelvinlab.wuyra.com

scriptings:
  - http_response:
      name: 喜马拉雅会员
      match: '^https?:\/\/.+((ximalaya)|(xmcdn)).+(mobile-user\/v2\/homePage|product\/detail\/v1|v1\/album\/track\/ts|mobile-playpage\/track\/v4\/baseInfo\/ts|mobile-playpage\/playpage\/tabs\/v2|mobile-playpage\/playpage\/track\/qualityAndEffect|mobile\/download\/v2\/track|mobile-user-grade\/decoratorV2\/decorationDetails\/page|mobile-album\/album\/plant\/grass)'
      script_url: https://resource.wuyra.com/Script/Himalaya/Himalaya.js
      body_required: true
      timeout: 60

url_rewrites:
  - match: '^https?:\/\/passport\.ximalaya\.com\/friendship-mobile\/v1\/findFriendsBanner\/show\/'
    location: "http://reject/"
  - match: '^https?:\/\/xdcs-collector\.ximalaya\.com\/api\/v1\/realtime'
    location: "http://reject/"
  - match: '^https?:\/\/adse\.wsa\.ximalaya\.com'
    location: "http://reject/"
  - match: '^https?:\/\/adse\.ximalaya\.com'
    location: "http://reject/"
  - match: '^https?:\/\/ad\.ximalaya\.com'
    location: "http://reject/"
  - match: '^https?:\/\/ulogs\.umeng\.com\/unify_logs'
    location: "http://reject/"
  - match: '^https?:\/\/mobile\.ximalaya\.com\/business-sale-promotion-guide-mobile-web\/popup\/info\/'
    location: "http://reject/"

map_locals:
  - match: '^https?:\/\/.+ximalaya\.com\/x-web-activity\/signIn\/getHomePageSignInInfo\/'
    status_code: 200
    headers:
      Content-Type: application/json
    body: ' '
  - match: '^https?:\/\/.+ximalaya\.com\/product\/promotion\/v1\/album\/price'
    status_code: 200
    headers:
      Content-Type: application/json
    body: ' '

mitm:
  hostnames:
    - mobwsa.ximalaya.com
    - mobile.ximalaya.com
    - apisg.himalaya.com
    - adse.ximalaya.com
    - ulogs.umeng.com
    - www.taobao.com
