name: Sync Kelvin Lab mirror

on:
  schedule:
    # 每天 02:30 (北京时间) = 18:30 UTC
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run sync
        run: python3 sync.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Sync Kelvin Lab updates $(date -u +%F)"
            git push
          fi
